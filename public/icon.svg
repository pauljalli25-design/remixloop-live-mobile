<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#1f2937" stroke-width="4" opacity="0.6" />

  <!-- 4 DJ Launchpad Grid Buttons -->
  <!-- Pad 1: Cyan Loop -->
  <rect x="76" y="80" width="160" height="150" rx="24" fill="#0f172a" stroke="url(#neonCyan)" stroke-width="6" filter="url(#glow)" />
  <circle cx="156" cy="155" r="32" fill="none" stroke="url(#neonCyan)" stroke-width="8" stroke-dasharray="140 30" />
  <polygon points="152,142 168,155 152,168" fill="url(#neonCyan)" />

  <!-- Pad 2: Pink Melody Loop -->
  <rect x="276" y="80" width="160" height="150" rx="24" fill="#0f172a" stroke="url(#neonPink)" stroke-width="6" filter="url(#glow)" />
  <path d="M 316 170 Q 336 130 356 155 T 396 140" fill="none" stroke="url(#neonPink)" stroke-width="8" stroke-linecap="round" />

  <!-- Pad 3: Amber "Bit Music" Beat Fill Button -->
  <rect x="76" y="270" width="160" height="150" rx="24" fill="#1e1808" stroke="url(#neonAmber)" stroke-width="6" filter="url(#glow)" />
  <polygon points="144,320 178,345 144,370" fill="url(#neonAmber)" />
  <rect x="184" y="322" width="6" height="46" rx="3" fill="url(#neonAmber)" />

  <!-- Pad 4: Green Bass Loop -->
  <rect x="276" y="270" width="160" height="150" rx="24" fill="#061e16" stroke="url(#neonGreen)" stroke-width="6" filter="url(#glow)" />
  <rect x="306" y="350" width="14" height="30" rx="4" fill="url(#neonGreen)" />
  <rect x="330" y="325" width="14" height="55" rx="4" fill="url(#neonGreen)" />
  <rect x="354" y="305" width="14" height="75" rx="4" fill="url(#neonGreen)" />
  <rect x="378" y="335" width="14" height="45" rx="4" fill="url(#neonGreen)" />

  <!-- Audio Waveform in Center -->
  <circle cx="256" cy="250" r="28" fill="#111827" stroke="#374151" stroke-width="3" />
  <circle cx="256" cy="250" r="10" fill="#00f2fe" />
</svg>
